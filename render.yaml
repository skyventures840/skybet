services:
  # Backend Service
  - type: web
    name: skybet-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://skybet-frontend.onrender.com
      - key: BACKEND_URL
        value: https://skybet-backend.onrender.com
    healthCheckPath: /health

  # Frontend Service  
  - type: web
    name: skybet-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    pullRequestPreviewsEnabled: false
    envVars:
      - key: REACT_APP_API_URL
        value: https://skybet-backend.onrender.com
      - key: REACT_APP_WS_URL
        value: https://skybet-backend.onrender.com
      - key: NODE_ENV
        value: production
    # SPA routing configuration
    routes:
      - type: rewrite
        source: /*
        destination: /index.html